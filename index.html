<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Kinora — Photo & Video Editor</title>
    <meta
      name="description"
      content="Pro-quality photo & video editing that's ridiculously easy. Free, private, runs in your browser on phone and PC."
    />
    <meta name="theme-color" content="#0e0f13" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kinora" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #0e0f13; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #a3a6b8;
        font: 500 15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #boot svg { width: 72px; height: 72px; animation: boot-pulse 1.4s ease-in-out infinite; }
      #boot div { display: grid; justify-items: center; gap: 14px; }
      @keyframes boot-pulse { 50% { transform: scale(0.92); opacity: 0.8; } }
      @media (prefers-color-scheme: light) { html, body { background: #f6f6fa; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <div>
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5BFF"/><stop offset=".55" stop-color="#B84DF1"/><stop offset="1" stop-color="#FF6A88"/></linearGradient></defs>
            <rect width="512" height="512" rx="116" fill="url(#b)"/>
            <path d="M190 168Q190 140 214 154L362 242Q386 256 362 270L214 358Q190 372 190 344Z" fill="#fff"/>
            <path d="M392 82Q398 114 430 120Q398 126 392 158Q386 126 354 120Q386 114 392 82Z" fill="#fff"/>
          </svg>
          <span>Loading Kinora…</span>
        </div>
      </div>
    </div>
    <noscript>Kinora needs JavaScript to run. Please enable it in your browser settings.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
